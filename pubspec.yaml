name: baby_cry_translator
description: "아기 언어 번역기 - XIAO ESP32S3 기반 아기 울음 분석 육아 보조기기 앱 (티라미수)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # 원격 확인용 MQTT 클라이언트 (ESP32 → 브로커 → 앱)
  mqtt_client: ^10.5.1
  # 같은 Wi-Fi에서 기기 직접 연결용 WebSocket
  web_socket_channel: ^3.0.1
  # 설정(브로커 주소, 기기 ID 등) 및 울음 기록 로컬 저장
  shared_preferences: ^2.3.2
  # 청각장애 부모 접근성 - 진동 알림
  vibration: ^3.1.3
  # 타임스탬프 포맷팅
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
